[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dfm-should-cost"
version = "0.1.0"
description = "Transparent manufacturing cost estimates and early DFM checks"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.45,<2",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "PyYAML>=6,<7",
  "reportlab>=4.3,<5",
  "cadquery-ocp>=7.9.3.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pypdf>=5,<7", "pymupdf>=1.25,<2"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
